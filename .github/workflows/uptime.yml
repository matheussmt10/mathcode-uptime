name: uptime

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check endpoints (2 tries each)
        id: check
        run: |
          failed=""
          for url in https://mathcode.com.br/ https://mathcode.com.br/links https://mathcode.com.br/api/health; do
            ok=0
            for try in 1 2; do
              code=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$url" || echo 000)
              if [ "$code" = 200 ]; then ok=1; break; fi
              sleep 20
            done
            [ $ok = 1 ] || failed="$failed $url($code)"
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
      - name: Open or close incident and alert on Telegram
        env:
          GH_TOKEN: ${{ github.token }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          FAILED: ${{ steps.check.outputs.failed }}
        run: |
          send() { curl -s -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" -d chat_id="$TG_CHAT" --data-urlencode text="$1"; }
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --label incidente --state open --json number --jq '.[0].number // empty')
          if [ -n "$FAILED" ] && [ -z "$open" ]; then
            gh label create incidente -R "$GITHUB_REPOSITORY" --color B60205 >/dev/null 2>&1 || true
            gh issue create -R "$GITHUB_REPOSITORY" --label incidente --title "Fora do ar: $FAILED" --body "Detectado em $(date -u +%FT%TZ)." >/dev/null
            send "🔴 mathcode fora do ar:$FAILED"
          elif [ -z "$FAILED" ] && [ -n "$open" ]; then
            gh issue close "$open" -R "$GITHUB_REPOSITORY" -c "Voltou em $(date -u +%FT%TZ)." >/dev/null
            send "🟢 mathcode voltou: site, links e API respondendo."
          fi
          [ -z "$FAILED" ]

  keepalive:
    # GitHub desliga agendamentos de repositórios públicos sem atividade por 60 dias
    if: github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable workflow monthly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%d%H%M)" = "011200" ]; then gh workflow enable uptime.yml -R "$GITHUB_REPOSITORY"; fi
